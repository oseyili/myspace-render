<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Status | MySpace Hotel</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#06101f;color:#06101f}a{text-decoration:none}

    h1{font-size:42px;color:#0b3b8f}.ok{background:#dcfce7;color:#075b24;border-radius:18px;padding:18px;font-weight:900}
    .box{background:#f2f6fd;border-radius:18px;padding:18px;margin:14px 0}.btn{background:#0b3b8f;color:#fff;padding:12px 16px;border-radius:12px;font-weight:900;display:inline-block;margin:6px}
  </style>
</head>
<body>
<main>
  <div class="brand">MYSPACE HOTEL</div>
  <h1>System Status</h1>
  <div class="ok">Operational</div>

  <div class="box"><h2>Customer search</h2><p>Operational</p></div>
  <div class="box"><h2>Reservation workflow</h2><p>Operational</p></div>
  <div class="box"><h2>Developer pages</h2><p>Operational</p></div>
  <div class="box"><h2>Partner onboarding pages</h2><p>Operational</p></div>
  <div class="box"><h2>Support</h2><p>reservations@myspace-hotel.com</p></div>

  <p>
    <a class="btn" href="/developers">Developers</a>
    <a class="btn" href="/api">API</a>
    <a class="btn" href="/partners">Partners</a>
    <a class="btn" href="/contact">Contact support</a>
  </p>
</main>
</body>
</html>
