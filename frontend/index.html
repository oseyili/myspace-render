<!-- MSH AFFILIATE VISIT BADGE START -->
<script>
(function () {
  try {
    var params = new URLSearchParams(window.location.search || "");
    var ref = String(params.get("ref") || "").trim().toUpperCase();

    if (!ref) return;

    localStorage.setItem("msh_affiliate_code", ref);

    function showAffiliateBadge() {
      if (document.getElementById("msh-affiliate-badge")) return;

      var badge = document.createElement("div");
      badge.id = "msh-affiliate-badge";
      badge.textContent = "Referral applied to this visit.";
      badge.style.margin = "0";
      badge.style.padding = "12px 34px";
      badge.style.background = "#ecfdf3";
      badge.style.color = "#166534";
      badge.style.borderBottom = "1px solid #bbf7d0";
      badge.style.fontFamily = "Arial, sans-serif";
      badge.style.fontWeight = "900";
      badge.style.fontSize = "15px";

      document.body.insertBefore(badge, document.body.firstChild);

      window.setTimeout(function () {
        if (badge && badge.parentNode) badge.parentNode.removeChild(badge);
      }, 7000);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", showAffiliateBadge);
    } else {
      showAffiliateBadge();
    }

    window.history.replaceState({}, document.title, window.location.pathname + window.location.hash);
  } catch (e) {}
})();
</script>
<!-- MSH AFFILIATE VISIT BADGE END -->





<!-- MSH AFFILIATE FETCH INJECT START -->
<script>
(function () {
  try {
    var originalFetch = window.fetch;
    window.fetch = function (input, init) {
      try {
        var url = typeof input === "string" ? input : (input && input.url) || "";
        var isBooking = url.indexOf("/api/book") !== -1;
        var ref = String(localStorage.getItem("msh_affiliate_code") || "").trim().toUpperCase();

        if (isBooking && ref && init && init.body && typeof init.body === "string") {
          var body = JSON.parse(init.body);
          body.affiliateCode = body.affiliateCode || ref;
          body.affiliate_code = body.affiliate_code || ref;
          body.ref = body.ref || ref;
          init = Object.assign({}, init, { body: JSON.stringify(body) });
        }
      } catch (e) {}

      return originalFetch.call(this, input, init);
    };
  } catch (e) {}
})();
</script>
<!-- MSH AFFILIATE FETCH INJECT END -->
